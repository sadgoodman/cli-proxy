name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./... -count=1

      - name: coverage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -eo pipefail
          go test ./... -count=1 -covermode=atomic -coverprofile=coverage.out | tee /tmp/coverage.txt
          {
            echo "### Coverage"
            echo
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
            echo
            echo "| package | coverage |"
            echo "|---|---|"
            awk '/coverage:/ {
                   pkg = ""; pct = ""
                   for (i = 1; i <= NF; i++) {
                     if ($i ~ /^cliproxy/) pkg = $i
                     if ($i ~ /%$/) pct = $i
                   }
                   if (pkg != "") print "| " pkg " | " pct " |"
                 }' /tmp/coverage.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: keep the coverage profile
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: test with -race
        run: go test ./... -count=1 -race

  cross:
    name: cross compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: build every supported target
        shell: bash
        run: |
          set -e
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 freebsd/amd64; do
            printf '%-20s ' "$target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -o /dev/null .
            echo ok
          done
