name: Release

# A version tag publishes a release with GoReleaser. The manual trigger runs the
# same verification and a snapshot build, but stops before publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: read the version from the source
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^const version = "\(.*\)"/\1/p' main.go)
          if [ -z "$version" ]; then
            echo "::error::cannot read the version from main.go"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "cli-proxy version $version"

      - name: check that the tag matches the source version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          tag="${GITHUB_REF_NAME}"
          echo "tag: $tag   source: v$version"
          if [ "v$version" != "$tag" ]; then
            echo "::error::main.go reports $version but the tag is $tag; bump one of them"
            exit 1
          fi

      - name: test
        run: go test ./... -count=1

      - name: check the GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

      - name: build the archives without publishing
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean

      - name: smoke test the linux build
        shell: bash
        run: |
          set -e
          archive=$(ls dist/cli-proxy_*_linux_amd64.tar.gz | head -1)
          echo "testing $archive"
          tmp=$(mktemp -d)
          tar -xzf "$archive" -C "$tmp"
          test -f "$tmp/README.md"
          test -f "$tmp/LICENSE"
          "$tmp/cli-proxy" -h >/dev/null
          "$tmp/cli-proxy" -version

      - name: verify the checksums
        shell: bash
        run: cd dist && sha256sum -c checksums.txt

      - name: keep the snapshot archives
        uses: actions/upload-artifact@v7
        with:
          name: cli-proxy-snapshot
          path: |
            dist/cli-proxy_*.tar.gz
            dist/cli-proxy_*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: publish the release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
